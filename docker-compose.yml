services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=architectai
      - POSTGRES_USER=architectai
      - POSTGRES_PASSWORD=architectai
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architectai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: 
      context: ./frontend
    env_file: .env
    ports:
      - "3000:3000"

  nginx:
    build: 
      context: ./nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: on-failure

volumes:
  db_data:

networks:
  default:
    driver: bridge